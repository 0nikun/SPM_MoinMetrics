spring.application.name=MoinMetrics
app.open-browser=true

spring.datasource.url=jdbc:postgresql://localhost:5432/moinmetrics
spring.datasource.username=moinmetrics
spring.datasource.password=moinmetrics_dev

# Sessions über Neustarts hinweg speichern
server.servlet.session.persistent=true

# Optional: Session nach X Minuten Inaktivität beenden
server.servlet.session.timeout=20m

# Datenbanktabellen automatisch aktualisieren
spring.jpa.hibernate.ddl-auto=update
