<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fehler - MoinMetrics</title>
    <link rel="stylesheet" href="/css/login.css" th:href="@{/css/login.css}">
    <link rel="stylesheet" href="/css/error.css" th:href="@{/css/error.css}">
</head>
<body>
<main class="login-layout">
    <section class="login-card error-card" aria-labelledby="error-title">
        <h1 id="error-title" th:text="${status == 404 ? '404 – Vom Kurs abgekommen?' : 'Etwas ist schiefgelaufen.'}">404 – Vom Kurs abgekommen?</h1>
        <a class="error-login-link" href="/login" th:href="@{/login}">Zurück zum Login</a>
    </section>
</main>
</body>
</html>
